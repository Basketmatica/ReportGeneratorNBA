# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — NBA Report Generator
#
# Cambios respecto al render.yaml previo:
#   - startCommand usa uvicorn con $PORT (Render inyecta esa variable; el
#     servidor TIENE que escuchar ahí o Render reporta "no open ports").
#   - buildCommand no duplica pip install (build.sh ya solo hace apt-get).
#   - envVars declaradas para que Render te las pida en el dashboard.
#
# Tras el primer deploy, configura en Render → Environment:
#   - API_KEY              → clave de Google AI Studio (https://aistudio.google.com/apikey)
#   - BALLDONTLIE_API_KEY  → clave gratuita de https://app.balldontlie.io
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: nba-report-generator
    runtime: python
    plan: free
    buildCommand: ./build.sh && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_KEY
        sync: false           # no se sincroniza desde el blueprint, hay que rellenarla en el dashboard
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LOG_LEVEL
        value: INFO
